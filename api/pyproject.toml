[project]
name = "companion"
version = "0.1.0"
description = "Disruption Companion API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Layer contracts (design D7). Python Protocols are not enforced at runtime, so the
# architecture is enforced here instead and checked by `make check`.
[tool.importlinter]
root_package = "companion"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services are framework-free and independent of adapters"
type = "forbidden"
source_modules = ["companion.services"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "httpx",
    "companion.presentation",
    "companion.repositories",
]

[[tool.importlinter.contracts]]
name = "Ports and schemas depend on nothing above them"
type = "forbidden"
source_modules = ["companion.ports", "companion.schemas"]
forbidden_modules = [
    "companion.services",
    "companion.repositories",
    "companion.presentation",
]

[[tool.importlinter.contracts]]
name = "The assessment is pure: it receives data, never ports"
type = "forbidden"
source_modules = ["companion.services.assessment"]
forbidden_modules = ["companion.ports"]

[[tool.importlinter.contracts]]
name = "Repositories do not depend on presentation or services"
type = "forbidden"
source_modules = ["companion.repositories"]
forbidden_modules = ["companion.presentation", "companion.services"]

[[tool.importlinter.contracts]]
name = "Presentation reaches adapters only through the composition root"
type = "forbidden"
source_modules = ["companion.presentation"]
forbidden_modules = ["companion.repositories"]
# Routers depend on providers in companion.composition, which builds the adapters.
# Only direct imports are forbidden; the indirect path through the root is the design.
allow_indirect_imports = true
